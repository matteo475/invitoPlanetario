<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invito</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      /* tramonto che diventa notte: richiama planetario + cena */
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(255, 214, 165, 0.35), transparent 32%),
        linear-gradient(160deg, #1e1b4b 0%, #4c1d95 38%, #be185d 78%, #fdba74 100%);
      background-attachment: fixed;
      padding: 20px;
      color: #1f2937;
      overflow-x: hidden;
    }

    body.celebrating {
      overflow: hidden;
    }

    /* stelle di sfondo */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.95;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 32px 40px;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 20px 50px rgba(30, 27, 75, 0.35);
      text-align: center;
      width: min(100%, 560px);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    .question {
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 20px;
      color: #4c1d95;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    /* programma della serata (card cliccabili) */
    .plan {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
      text-align: left;
    }

    .plan-item {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 10px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 16px rgba(76, 29, 149, 0.1);
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .plan-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(76, 29, 149, 0.16);
    }

    .plan-item:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 2px;
    }

    .plan-icon {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 1.35rem;
      background: linear-gradient(135deg, #c4b5fd, #f9a8d4);
    }

    .plan-title {
      font-weight: 800;
      color: #4c1d95;
      line-height: 1.2;
    }

    .plan-meta {
      font-size: 0.9rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .plan-cal {
      margin-left: auto;
      flex: none;
      font-size: 1.2rem;
      opacity: 0.75;
    }

    .gifs {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .gifs img {
      width: clamp(220px, 62vw, 300px);
      height: clamp(150px, 40vw, 200px);
      object-fit: cover;
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(30, 27, 75, 0.25);
      border: 4px solid rgba(255, 255, 255, 0.9);
    }

    .gifs img.is-photo {
      object-position: center 30%;
    }

    .carousel-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
    }

    .carousel-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(76, 29, 149, 0.22);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .carousel-dot.active {
      background: #db2777;
      transform: scale(1.15);
    }

    /* frasi che appaiono a schermo */
    .phrase {
      min-height: 2.8em;
      margin: 0 0 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 600;
      font-style: italic;
      line-height: 1.4;
      color: #6d28d9;
      transition: opacity 0.35s ease;
    }

    .phrase.hide {
      opacity: 0;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }

    .buttons button {
      flex: 1 1 140px;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: transform 0.25s ease, opacity 0.3s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    }

    #yesButton {
      background: linear-gradient(135deg, #34d399, #22c55e);
      color: #ffffff;
      transform-origin: center;
    }

    #noButton {
      background: linear-gradient(135deg, #fb7185, #ef4444);
      color: #ffffff;
    }

    .buttons button:hover {
      filter: brightness(1.03);
      transform: translateY(-1px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
    }

    .buttons button:active {
      transform: translateY(1px);
    }

    .buttons button:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 3px;
    }

    /* pulsante musica */
    .music-toggle {
      position: fixed;
      top: max(12px, env(safe-area-inset-top, 0px));
      right: 12px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #4c1d95;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(30, 27, 75, 0.3);
    }

    .music-toggle.on {
      background: linear-gradient(135deg, #ede9fe, #fce7f3);
    }

    .music-toggle.attention {
      animation: ring 2s ease-out infinite;
    }

    .music-toggle:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    @keyframes ring {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.65);
      }

      100% {
        box-shadow: 0 0 0 14px rgba(255, 255, 255, 0);
      }
    }

    /* schermata del Sì */
    .celebration-layer {
      position: fixed;
      inset: 0;
      display: flex;
      overflow-y: auto;
      padding: 20px;
      background: rgba(30, 27, 75, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transform: scale(1.02);
      transition: opacity 0.28s ease, transform 0.28s ease;
      z-index: 20;
    }

    .celebration-layer.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .celebration-card {
      width: min(100%, 520px);
      margin: auto;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 240, 246, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(30, 27, 75, 0.4);
      padding: 32px 24px;
      position: relative;
      overflow: hidden;
    }

    .celebration-card::before {
      content: "";
      position: absolute;
      inset: -30% auto auto -20%;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(167, 139, 250, 0.35), transparent 65%);
      filter: blur(8px);
      pointer-events: none;
    }

    .celebration-card::after {
      content: "";
      position: absolute;
      inset: auto -20% -35% auto;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.28), transparent 65%);
      filter: blur(10px);
      pointer-events: none;
    }

    .celebration-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin-bottom: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c4b5fd, #f472b6);
      box-shadow: 0 16px 30px rgba(244, 114, 182, 0.35);
      font-size: 2rem;
      animation: bounce 1s infinite alternate ease-in-out;
      position: relative;
    }

    .celebration-title {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 10px;
      color: #be185d;
      font-weight: 900;
      letter-spacing: -0.05em;
      position: relative;
    }

    .celebration-text {
      margin: 0;
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.5;
      color: #4c1d95;
      font-weight: 600;
      position: relative;
    }

    .countdown {
      position: relative;
      margin: 14px 0 0;
      font-size: 1rem;
      font-weight: 700;
      color: #6d28d9;
    }

    .confetti {
      position: fixed;
      top: -10px;
      width: 10px;
      height: 16px;
      border-radius: 2px;
      opacity: 0.95;
      z-index: 21;
      animation: fall 1.8s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 1;
      }
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-10px);
      }
    }

    /* foto in stile polaroid */
    .polaroids {
      position: relative;
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 20px 0 4px;
    }

    .polaroid {
      margin: 0;
      width: 120px;
      padding: 6px 6px 8px;
      background: #ffffff;
      border-radius: 4px;
      box-shadow: 0 8px 18px rgba(30, 27, 75, 0.25);
    }

    .polaroid:nth-child(odd) {
      transform: rotate(-4deg);
    }

    .polaroid:nth-child(even) {
      transform: rotate(3deg);
    }

    .polaroid img {
      display: block;
      width: 100%;
      height: 120px;
      object-fit: cover;
      object-position: center 30%;
    }

    .polaroid figcaption {
      margin-top: 6px;
      font-size: 0.75rem;
      color: #6b7280;
      text-align: center;
    }

    /* sezioni nella schermata del Sì */
    .cel-section {
      position: relative;
      margin-top: 22px;
      text-align: left;
    }

    .cel-heading {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 800;
      color: #4c1d95;
    }

    /* biglietto che si sblocca */
    .letter-envelope {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 12px 16px;
      border: 1.5px dashed #c4b5fd;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.85);
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    .letter-envelope.unlocked {
      border-style: solid;
      border-color: #db2777;
      animation: glow 2.2s ease-in-out infinite;
    }

    .letter-envelope.shake {
      animation: shake 0.45s;
    }

    .letter-envelope:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 2px;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(219, 39, 119, 0.35);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(219, 39, 119, 0);
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }
    }

    .letter-icon {
      flex: none;
      font-size: 1.9rem;
      line-height: 1;
    }

    .letter-title {
      display: block;
      font-weight: 800;
      color: #4c1d95;
    }

    .letter-hint {
      display: block;
      margin-top: 2px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .letter-paper {
      margin-top: 12px;
      padding: 18px 18px 14px;
      border-radius: 14px;
      border: 1px solid #fde7c0;
      background: #fffaf0;
      box-shadow: 0 6px 16px rgba(124, 45, 18, 0.12);
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      line-height: 1.65;
      color: #7c2d12;
    }

    .letter-paper p {
      margin: 0 0 10px;
    }

    .letter-paper ul {
      margin: 0 0 10px;
      padding-left: 20px;
    }

    .letter-paper .letter-sign {
      margin: 6px 0 0;
      text-align: right;
    }

    /* domande con risposta nell'email */
    .choice-group {
      margin-bottom: 14px;
    }

    .choice-title {
      margin-bottom: 8px;
      font-weight: 700;
      color: #1f2937;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      padding: 8px 14px;
      border: 1.5px solid #ddd6fe;
      border-radius: 999px;
      background: #ffffff;
      color: #4c1d95;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .chip[aria-checked="true"] {
      border-color: transparent;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: #ffffff;
    }

    .chip:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 2px;
    }

    .choices-status {
      margin: 10px 0 0;
      min-height: 1.3em;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .choice-summary {
      margin: 0 0 6px;
      padding: 0;
      list-style: none;
      color: #4c1d95;
      font-weight: 600;
    }

    .celebration-actions {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    .cal-cta {
      display: inline-block;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      color: #ffffff;
      padding: 13px 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.35);
    }

    .cal-cta.alt {
      background: #ffffff;
      color: #4c1d95;
      border: 2px solid #c4b5fd;
      box-shadow: none;
    }

    .cal-cta:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .cal-cta:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 2px;
    }

    .playlist-embed {
      position: relative;
      margin-top: 14px;
    }

    .playlist-embed iframe {
      display: block;
      width: 100%;
      height: 152px;
      border: 0;
      border-radius: 12px;
    }

    /* stelle cadenti e desideri */
    .shooting-star {
      position: fixed;
      z-index: 40;
      width: 110px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, #ffffff, rgba(255, 255, 255, 0));
      box-shadow: 0 0 8px 1px rgba(255, 255, 255, 0.8);
      pointer-events: none;
      animation: shoot 0.9s ease-out forwards;
    }

    @keyframes shoot {
      from {
        transform: translate(0, 0) rotate(-35deg);
        opacity: 1;
      }

      to {
        transform: translate(-190px, 133px) rotate(-35deg);
        opacity: 0;
      }
    }

    .wish {
      position: fixed;
      z-index: 41;
      max-width: 250px;
      padding: 8px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      color: #4c1d95;
      font-size: 0.9rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 8px 20px rgba(30, 27, 75, 0.35);
      pointer-events: none;
      animation: wishUp 2.4s ease-out forwards;
    }

    @keyframes wishUp {
      0% {
        opacity: 0;
        transform: translate(-50%, -70%);
      }

      15% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -160%);
      }
    }

    /* finestra "posto + calendario" */
    .sheet-layer {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(30, 27, 75, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 30;
    }

    .sheet-layer.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: relative;
      width: min(100%, 420px);
      max-height: calc(100dvh - 40px);
      overflow-y: auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 24px 20px 20px;
      box-shadow: 0 24px 60px rgba(30, 27, 75, 0.45);
      text-align: left;
    }

    .sheet-title {
      margin: 0 40px 14px 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: #4c1d95;
    }

    .sheet-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: #f3e8ff;
      color: #4c1d95;
      font-size: 1rem;
      cursor: pointer;
    }

    .sheet-section-title {
      margin: 18px 0 2px;
      font-size: 0.95rem;
      font-weight: 800;
      color: #4c1d95;
    }

    .sheet-place {
      margin-bottom: 4px;
    }

    .sheet-map {
      display: block;
      width: 100%;
      height: 220px;
      border: 0;
      border-radius: 16px;
      background: #f3e8ff;
    }

    .sheet-photo {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .sheet-place-name {
      margin: 10px 0 2px;
      font-weight: 700;
      color: #1f2937;
    }

    .sheet-place-addr {
      margin: 0 0 10px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .sheet-place-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #f1e8fb;
    }

    .sheet-row-title {
      font-weight: 700;
      color: #1f2937;
    }

    .sheet-row-when {
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 2px;
    }

    .sheet-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      border: none;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
    }

    .sheet-btn.google {
      background: #eef2ff;
      color: #3730a3;
    }

    .sheet-btn.maps {
      background: #ecfdf5;
      color: #065f46;
    }

    .sheet-btn.ics {
      width: 100%;
      margin-top: 16px;
      padding: 13px 16px;
      font-size: 1rem;
      color: #ffffff;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 10px 24px rgba(124, 58, 237, 0.3);
    }

    .sheet-btn:focus-visible,
    .sheet-close:focus-visible {
      outline: 3px solid #4c1d95;
      outline-offset: 2px;
    }

    .sheet-note {
      margin: 12px 0 0;
      font-size: 0.82rem;
      line-height: 1.4;
      color: #6b7280;
    }

    @media (max-width: 768px) {
      .card {
        padding: 28px 24px;
        border-radius: 24px;
      }

      .question {
        font-size: 20px;
      }
    }

    @media (max-width: 520px) {
      .card {
        padding: 22px 16px;
        border-radius: 22px;
      }

      .question {
        font-size: 18px;
        margin-bottom: 16px;
        line-height: 1.35;
      }

      .plan {
        margin-bottom: 18px;
      }

      .plan-item {
        padding: 8px 12px;
        gap: 12px;
      }

      .plan-icon {
        width: 38px;
        height: 38px;
        font-size: 1.15rem;
      }

      .gifs {
        margin-bottom: 18px;
        gap: 10px;

    /* ---------- riferimenti alla pagina ---------- */

    const musicIcon = $("musicIcon");

    /* ---------- stelle di sfondo ---------- */

    /* ---------- programma della serata (card cliccabili) ---------- */
    stops.forEach((stop) => {

      item.className = "plan-item";
      item.setAttribute("aria-label", `${stop.title}: dettagli, mappa e calendario`);

      const icon = document.createElement("div");

    /* ---------- frasi che appaiono a schermo ---------- */
    const sweetPhrases = [

      "Con te il tempo passa alla velocità della luce ⚡",
      "Il planetario è solo la scusa per passare la serata con te 🔭",

      "Ehi, le stelle contavano su di te 🥺",

      "Il No sta perdendo quota… 🛰️",
      "Il No è stato risucchiato da un buco nero. Resta solo il Sì 🕳️💖",

    let phraseIdx = 0;

    function setPhrase(text) {
      phraseEl.classList.add("hide");

      phraseSwap = setTimeout(() => {
        phraseEl.textContent = text;
        phraseEl.classList.remove("hide");
      }, 350);
    }
    function nextSweetPhrase() {
      setPhrase(sweetPhrases[phraseIdx % sweetPhrases.length]);
      phraseIdx += 1;
    }
    function startPhrases(delay = 5000) {
      clearInterval(phraseTimer);
      phraseTimer = setInterval(nextSweetPhrase, delay);
    }
    function showNoPhrase() {
      setPhrase(noPhrases[noIdx % noPhrases.length]);
      noIdx += 1;
      startPhrases(6000); // il tempo di leggerla prima di tornare alle frasi dolci
    }

    /* ---------- 7) il No scherzoso ---------- */

    let noClicks = 0;
    let noDx = 0;
    let noDy = 0;
    let noGone = false;

    function applyNo() {
      const s = Math.max(0.4, 1 - noClicks * 0.15);
      const rot = noClicks === 0 ? 0 : noClicks % 2 ? -6 : 6;
      noButton.style.transform = `translate(${noDx}px, ${noDy}px) scale(${s}) rotate(${rot}deg)`;
      yesButton.style.transform = `scale(${1 + Math.min(noClicks, 4) * 0.2})`;
    }
    function removeNo() {
      noGone = true;
      noButton.style.opacity = "0";

    // sul computer, dopo un paio di click il No scappa quando il mouse si avvicina
    noButton.addEventListener("pointerenter", () => {
      if (!canHover || noGone || noClicks < 2) return;
      noDx = rand(-70, 70);
      noDy = rand(-45, 45);
      applyNo();
    });
    noButton.addEventListener("click", () => {
      if (noGone) return;
      noClicks += 1;
      noDx = 0;
      noDy = 0;
      showNoPhrase();
      if (noClicks >= NO_MAX) removeNo();
      else applyNo();
    });

    /* ---------- email (EmailJS) ---------- */
    const buildMapImageUrl = () => {
      const withAddress = stops.filter((s) => s.address);
      if (!withAddress.length) return "";
      let url = "https://maps.googleapis.com/maps/api/staticmap?size=600x320&scale=2&maptype=roadmap";

      withAddress.forEach((s, i) => {

      return `${url}&key=${mapsApiKey}`;

      emailjs.send(serviceId, templateId, templateParams)

    /* ---------- 3) conto alla rovescia ---------- */
    const eventStart = stopStart(stops[0]);

    function updateCountdown() {
      const now = new Date();
      let text;
      if (now > eventDayEnd) {
        text = "Spero sia stata una serata stellata 💫";
      } else if (now >= eventStart) {
        text = "Oggi è il giorno delle stelle! 🌟";
      } else {
        let mins = Math.floor((eventStart - now) / 60000);
        const d = Math.floor(mins / 1440);
        mins -= d * 1440;
        const h = Math.floor(mins / 60);
        const m = mins - h * 60;
        if (d >= 1) {
          text = `Tra ${plural(d, "giorno", "giorni")}${h ? ` e ${plural(h, "ora", "ore")}` : ""} si parte per le stelle 🚀`;

          text = `Tra ${plural(h, "ora", "ore")}${m ? ` e ${plural(m, "minuto", "minuti")}` : ""} si parte per le stelle 🚀`;

    function openLetter() {
      letterOpened = true;

    /* ---------- calendario (Google Calendar + file .ics con promemoria) ---------- */
    let lastFocus = null;

    function eventTimes(stop) {
      const dayStr = eventDate.replace(/-/g, "");
      if (!hasTime(stop)) {
        const next = new Date(`${eventDate}T00:00:00`);
        next.setDate(next.getDate() + 1);
        const nextStr = `${next.getFullYear()}${pad(next.getMonth() + 1)}${pad(next.getDate())}`;
        return { allDay: true, start: dayStr, end: nextStr };
      }
      const start = stopStart(stop);
      const end = new Date(start.getTime() + (stop.durationMin || 90) * 60000);
      const fmt = (d) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}` +
        `T${pad(d.getHours())}${pad(d.getMinutes())}00`;
      return { allDay: false, start: fmt(start), end: fmt(end) };
    }

    function googleCalendarUrl(stop) {
      const t = eventTimes(stop);
      const params = new URLSearchParams({
        action: "TEMPLATE",
        text: eventTitle(stop),
        dates: `${t.start}/${t.end}`,
        details: stop.hint || "",
        location: eventLocation(stop),
        ctz: "Europe/Rome",
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    const icsEscape = (s) =>
      String(s)
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/\n/g, "\\n");

    function buildIcs(list) {
      const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Invito//IT", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
      list.forEach((stop) => {
        const t = eventTimes(stop);
        lines.push("BEGIN:VEVENT", `UID:invito-${eventDate}-${stops.indexOf(stop)}@invito.local`, `DTSTAMP:${stamp}`);
        if (t.allDay) {
          lines.push(`DTSTART;VALUE=DATE:${t.start}`, `DTEND;VALUE=DATE:${t.end}`);
        } else {
          lines.push(`DTSTART:${t.start}`, `DTEND:${t.end}`);
        }
        lines.push(`SUMMARY:${icsEscape(eventTitle(stop))}`);
        if (stop.hint) lines.push(`DESCRIPTION:${icsEscape(stop.hint)}`);
        if (eventLocation(stop)) lines.push(`LOCATION:${icsEscape(eventLocation(stop))}`);
        // promemoria: giorno prima + 2 ore prima (senza orario: giorno prima ore 9:00 + mattina ore 8:00)
        const alarms = t.allDay ? ["-PT15H", "PT8H"] : ["-P1D", "-PT2H"];
        alarms.forEach((trigger) => {
          lines.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEscape(eventTitle(stop))}`, `TRIGGER:${trigger}`, "END:VALARM");
        });
        lines.push("END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      return lines.join("\r\n");
    }

    function downloadIcs(list) {
      const filename = list.length > 1 ? "serata-sabato-26.ics" : "evento-sabato-26.ics";
      const blob = new Blob([buildIcs(list)], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);

    /* ---------- musica spaziale (sintetizzata dal browser, nessun file audio) ---------- */
    let audioCtx = null;
    let master = null;
    let padBus = null;
    let sparkleBus = null;
    let musicOn = false;
    let userMuted = false;
    let chordIdx = 0;
    let chordTimer = null;
    let sparkleTimer = null;

    const midiToHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    // Am9 → Fmaj9 → Cmaj9 → Gmaj9, lenti e sospesi
    const chords = [
      [45, 52, 60, 64, 67, 71],
      [41, 48, 57, 64, 67, 69],
      [48, 55, 59, 64, 67, 74],
      [43, 50, 59, 62, 66, 69],
    ];
    const sparkleNotes = [81, 84, 88, 93, 96]; // note acute, come stelle che brillano

    function makeImpulse(ctx, seconds, decay) {
      const rate = ctx.sampleRate;
      const len = Math.floor(rate * seconds);
      const buf = ctx.createBuffer(2, len, rate);
      for (let c = 0; c < 2; c += 1) {
        const data = buf.getChannelData(c);
        for (let i = 0; i < len; i += 1) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
        }
      }
      return buf;
    }

    function initAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      audioCtx = new AC();

      master = audioCtx.createGain();
      master.gain.value = 0;
      master.connect(audioCtx.destination);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 1400;
      filter.Q.value = 0.6;

      // il filtro "respira" lentamente
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.06;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 500;
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);
      lfo.start();

      const reverb = audioCtx.createConvolver();
      reverb.buffer = makeImpulse(audioCtx, 6, 2.2);
      const dry = audioCtx.createGain();
      dry.gain.value = 0.55;
      const wet = audioCtx.createGain();
      wet.gain.value = 0.7;

      padBus = audioCtx.createGain();
      padBus.connect(filter);
      filter.connect(dry);
      filter.connect(reverb);
      reverb.connect(wet);
      dry.connect(master);
      wet.connect(master);

      sparkleBus = audioCtx.createGain();
      sparkleBus.connect(reverb);
      sparkleBus.connect(dry);
      return true;
    }

    function playChord(notes, t, dur) {
      notes.forEach((m) => {
        [-7, 7].forEach((detune) => {
          const o = audioCtx.createOscillator();
          o.type = m < 60 ? "sine" : "triangle";
          o.frequency.value = midiToHz(m);
          o.detune.value = detune;
          const g = audioCtx.createGain();
          const peak = m < 55 ? 0.05 : 0.028;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(peak, t + 3);
          g.gain.setValueAtTime(peak, t + dur);
          g.gain.linearRampToValueAtTime(0.0001, t + dur + 4);
          o.connect(g);
          g.connect(padBus);
          o.start(t);
          o.stop(t + dur + 4.1);
        });
      });
    }

    function scheduleChord() {
      if (!musicOn) return;
      if (audioCtx.state === "running") {
        playChord(chords[chordIdx % chords.length], audioCtx.currentTime + 0.05, 8);
        chordIdx += 1;
      }
      chordTimer = setTimeout(scheduleChord, 7000);
    }

    function scheduleSparkle() {
      if (!musicOn) return;
      if (audioCtx.state === "running") {
        const note = sparkleNotes[Math.floor(Math.random() * sparkleNotes.length)];
        const t = audioCtx.currentTime + 0.05;
        const o = audioCtx.createOscillator();
        o.type = "sine";
        o.frequency.value = midiToHz(note);
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.045, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 3.5);
        o.connect(g);
        g.connect(sparkleBus);
        o.start(t);
        o.stop(t + 3.6);
      }
      sparkleTimer = setTimeout(scheduleSparkle, 1800 + Math.random() * 3500);
    }

    function updateMusicUi() {
      musicBtn.classList.toggle("on", musicOn);
      musicBtn.setAttribute("aria-pressed", String(musicOn));

    function setMusic(on) {
      musicBtn.classList.remove("attention");
      if (on) {
        if (!audioCtx && !initAudio()) return;
        musicOn = true;
        userMuted = false;
        audioCtx.resume();
        master.gain.setTargetAtTime(0.5, audioCtx.currentTime, 1.2);
        clearTimeout(chordTimer);
        clearTimeout(sparkleTimer);
        scheduleChord();
        sparkleTimer = setTimeout(scheduleSparkle, 2500);
      } else {
        musicOn = false;
        userMuted = true;
        clearTimeout(chordTimer);
        clearTimeout(sparkleTimer);
        if (audioCtx) {
          master.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
          setTimeout(() => {
            if (!musicOn) audioCtx.suspend();

    }

    /* ---------- carosello: gif a tema spazio (+ le vostre foto) ---------- */
    // gatti nello spazio alternati a cieli stellati e galassie
    const gifIds = [
      "rdJCzxBWIvqGA",
      "UQavon815BcCk",
      "lHVzwFfa8eyuA",
      "SS8pVIhR4vHU2rANmO",
      "5HSYaZTcRpYnS",
      "W0DdAs9ruu70E9Yqt2",
      "u8jong5bYNHGg",
      "l0Exm2Wa4TermgtJC",
      "RrIdGcnknHD0c",
      "O0oQygeklvnX2",
    ];
    const slides = [];
    {
      let p = 0;
      gifIds.forEach((id, i) => {
        slides.push({ src: `https://media.giphy.com/media/${id}/giphy.gif`, photo: false });
        if (i % 2 === 1 && p < photoList.length) slides.push({ src: photoList[p++].src, photo: true });
      });
      while (p < photoList.length) slides.push({ src: photoList[p++].src, photo: true });

    let index = 0;
    let slideTimer = null;

    function renderDots() {
      carouselDots.innerHTML = "";
      slides.forEach((_, i) => {
        const dot = document.createElement("span");
        dot.className = `carousel-dot${i === index ? " active" : ""}`;

    function showSlide(nextIndex) {
      index = (nextIndex + slides.length) % slides.length;
      const slide = slides[index];
      gifImage.src = slide.src;
      gifImage.classList.toggle("is-photo", slide.photo);
      gifImage.alt = slide.photo ? "Una nostra foto" : "Gif a tema spazio";
      renderDots();
      clearTimeout(slideTimer);
      slideTimer = setTimeout(() => showSlide(index + 1), slide.photo ? 3500 : 2500);
    }

    // se una gif/foto non si carica, la togliamo dal giro e passiamo alla prossima
    gifImage.addEventListener("error", () => {
      if (slides.length <= 1) return;
      slides.splice(index, 1);
      showSlide(index);
    });

    /* ---------- avvio ---------- */
    nextSweetPhrase();
    startPhrases();
    showSlide(0);
    updateCountdown();
    setInterval(updateCountdown, 30000);
    renderLetterState();
    setInterval(renderLetterState, 30000); // si sblocca da solo all'ora giusta
    if (store.get("letterOpened") === "1" && isUnlocked()) openLetter();
    renderChoices();

    // se aveva già risposto Sì, ritrova subito la schermata (senza coriandoli)
    if (store.get("yes") === "1") {
      showCelebration(false);
      sendYesEmail(false); // se la prima email non era partita, riprova in silenzio
    }
  </script>
</body>

</html>
